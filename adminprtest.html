<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload - StreamBox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">StreamBox Upload</div>

    <nav>
      <a href="index.html">View Site</a>
    </nav>
  </header>

  <main class="admin-page">

    <section class="admin-box">
      <div class="admin-header">
        <h1>Upload Videos</h1>
        <p>Paste up to 100 iframe embed codes or embed links at once.</p>
      </div>

      <div class="admin-section">
        <label>Bulk Iframe Codes / Embed Links</label>

        <textarea 
          id="bulkEmbedInput" 
          class="big-upload-box"
          placeholder='Paste your embed codes here.

Best format:
Paste 1 full iframe/embed code per line.

Example:
<iframe src="https://example.com/embed/123" title="Video title"></iframe>
<iframe src="https://example.com/embed/456" title="Another video"></iframe>

Optional thumbnail format:
<iframe src="https://example.com/embed/123" title="Video title"></iframe> || https://example.com/thumb.jpg'>
        </textarea>

        <p class="admin-help">
          Tip: paste one video embed code per line. Limit: 100 videos per upload.
        </p>

        <button id="addVideosBtn">Add Videos</button>
      </div>

      <hr class="admin-divider">

      <div class="admin-section">
        <div class="saved-header">
          <div>
            <h2>Saved Videos</h2>
            <p id="videoCountText" class="admin-help">0 videos saved</p>
          </div>

          <div class="admin-actions">
            <button id="showAllBtn">Show All</button>
            <button id="showMissingBtn">Missing Thumbnails</button>
            <button id="saveAllDurationsBtn">Save All Durations</button>
            <button id="exportVideosBtn">Export videos.js</button>
            <button id="deleteSelectedBtn" class="delete-btn">Delete Selected</button>
            <button id="clearAllBtn" class="delete-btn">Delete All</button>
          </div>
        </div>

        <p id="filterStatusText" class="admin-help">Showing all videos</p>

        <div id="videoList"></div>
      </div>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
