<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload - StreamBox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">StreamBox Upload</div>

    <nav>
      <a href="index.html">View Site</a>
    </nav>
  </header>

  <main class="admin-page">

    <section class="admin-box">
      <div class="admin-header">
        <h1>Upload Videos</h1>
        <p>Add up to 5 embedded videos at once. Paste an embed link or full iframe code.</p>
      </div>

      <div class="admin-section">
        <h2>Add 5 Videos</h2>

        <!-- VIDEO 1 -->
        <div class="multi-video-box">
          <h3>Video 1</h3>

          <label>Video Title</label>
          <input type="text" class="titleInput" placeholder="Example: Funny Video" />

          <label>Embed Link or Full Iframe Code</label>
          <textarea class="embedInput" placeholder='Paste embed link or iframe code here'></textarea>

          <label>Thumbnail Link Optional</label>
          <input type="text" class="thumbnailInput" placeholder="Optional thumbnail image link" />
        </div>

        <!-- VIDEO 2 -->
        <div class="multi-video-box">
          <h3>Video 2</h3>

          <label>Video Title</label>
          <input type="text" class="titleInput" placeholder="Example: Cool Edit" />

          <label>Embed Link or Full Iframe Code</label>
          <textarea class="embedInput" placeholder='Paste embed link or iframe code here'></textarea>

          <label>Thumbnail Link Optional</label>
          <input type="text" class="thumbnailInput" placeholder="Optional thumbnail image link" />
        </div>

        <!-- VIDEO 3 -->
        <div class="multi-video-box">
          <h3>Video 3</h3>

          <label>Video Title</label>
          <input type="text" class="titleInput" placeholder="Example: Music Video" />

          <label>Embed Link or Full Iframe Code</label>
          <textarea class="embedInput" placeholder='Paste embed link or iframe code here'></textarea>

          <label>Thumbnail Link Optional</label>
          <input type="text" class="thumbnailInput" placeholder="Optional thumbnail image link" />
        </div>

        <!-- VIDEO 4 -->
        <div class="multi-video-box">
          <h3>Video 4</h3>

          <label>Video Title</label>
          <input type="text" class="titleInput" placeholder="Example: Gaming Clip" />

          <label>Embed Link or Full Iframe Code</label>
          <textarea class="embedInput" placeholder='Paste embed link or iframe code here'></textarea>

          <label>Thumbnail Link Optional</label>
          <input type="text" class="thumbnailInput" placeholder="Optional thumbnail image link" />
        </div>

        <!-- VIDEO 5 -->
        <div class="multi-video-box">
          <h3>Video 5</h3>

          <label>Video Title</label>
          <input type="text" class="titleInput" placeholder="Example: Favorite Video" />

          <label>Embed Link or Full Iframe Code</label>
          <textarea class="embedInput" placeholder='Paste embed link or iframe code here'></textarea>

          <label>Thumbnail Link Optional</label>
          <input type="text" class="thumbnailInput" placeholder="Optional thumbnail image link" />
        </div>

        <button id="addVideosBtn">Add Videos</button>
      </div>

      <hr class="admin-divider">

      <div class="admin-section">
        <div class="saved-header">
          <div>
            <h2>Saved Videos</h2>
            <p id="videoCountText" class="admin-help">0 videos saved</p>
          </div>

          <button id="clearAllBtn" class="delete-btn">Delete All</button>
        </div>

        <div id="videoList"></div>
      </div>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
