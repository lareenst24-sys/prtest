<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload - StreamBox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">StreamBox Upload</div>

    <nav>
      <a href="index.html">View Site</a>
    </nav>
  </header>

  <main class="admin-page">

    <section class="admin-box">
      <div class="admin-header">
        <h1>Upload Videos</h1>
        <p>Paste up to 5 iframe embed codes or embed links. The site will add them automatically.</p>
      </div>

      <div class="admin-section">
        <label>Iframe Code / Embed Link 1</label>
        <input type="text" class="embedInput" placeholder='Paste iframe code or embed link here' />

        <label>Iframe Code / Embed Link 2</label>
        <input type="text" class="embedInput" placeholder='Paste iframe code or embed link here' />

        <label>Iframe Code / Embed Link 3</label>
        <input type="text" class="embedInput" placeholder='Paste iframe code or embed link here' />

        <label>Iframe Code / Embed Link 4</label>
        <input type="text" class="embedInput" placeholder='Paste iframe code or embed link here' />

        <label>Iframe Code / Embed Link 5</label>
        <input type="text" class="embedInput" placeholder='Paste iframe code or embed link here' />

        <button id="addVideosBtn">Add Videos</button>
      </div>

      <hr class="admin-divider">

      <div class="admin-section">
        <div class="saved-header">
          <div>
            <h2>Saved Videos</h2>
            <p id="videoCountText" class="admin-help">0 videos saved</p>
          </div>

          <button id="clearAllBtn" class="delete-btn">Delete All</button>
        </div>

        <div id="videoList"></div>
      </div>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
