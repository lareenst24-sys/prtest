<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamBox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">StreamBox</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Videos</a>
      <a href="#">Categories</a>
      <a href="#">Upload</a>
    </nav>
  </header>

  <section class="hero">
    <div>
      <h1>Watch videos in a clean simple space.</h1>
      <p>Stream embedded videos in a minimal black and white design.</p>
      <button>Start Watching</button>
    </div>
  </section>

  <main class="content">
    <h2>Featured Videos</h2>

    <div class="video-grid">

      <!-- VIDEO CARD 1 -->
      <div class="video-card">
        <div class="embed-box">
          <!-- PASTE YOUR VIDEO EMBED LINK HERE -->
         <iframe src="https://www.pornhub.com/embed/c3dbc9a5d726288d8a4b" frameborder="0" height="481" width="608" scrolling="no">
         </iframe>
      </div>

      <!-- VIDEO CARD 2 -->
      <div class="video-card">
        <div class="embed-box">
          <!-- PASTE YOUR VIDEO EMBED LINK HERE -->
          <iframe 
            src="https://www.youtube.com/embed/VIDEO_ID_HERE"
            title="Video player"
            frameborder="0"
            allowfullscreen>
          </iframe>
        </div>

        <h3>Another Video Title</h3>
        <p>Creator Name</p>
      </div>

      <!-- VIDEO CARD 3 -->
      <div class="video-card">
        <div class="embed-box">
          <!-- PASTE YOUR VIDEO EMBED LINK HERE -->
          <iframe 
            src="https://www.youtube.com/embed/VIDEO_ID_HERE"
            title="Video player"
            frameborder="0"
            allowfullscreen>
          </iframe>
        </div>

        <h3>New Upload</h3>
        <p>Creator Name</p>
      </div>

    </div>
  </main>

  <footer>
    <p>© 2026 StreamBox. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
