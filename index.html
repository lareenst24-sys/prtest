<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALDZONE</title>
  <link rel="stylesheet" href="style.css?v=15" />
</head>
<body>

  <header class="navbar">
    <div class="logo">ALDZONE</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="#videos">Videos</a>
      <a href="#games">Games</a>
    </nav>
  </header>

  <main class="content">

    <!-- GAMES SECTION -->
    <section class="games-section" id="games">
      <div class="section-header">
        <h2>Games</h2>
      </div>

      <div class="games-row" id="gamesGrid">
        <!-- Games will load here automatically from games.js -->
      </div>
    </section>

    <!-- VIDEOS SECTION -->
    <section id="videos">
      <h2>Featured Videos</h2>

      <div class="video-grid" id="videoGrid">
        <!-- Videos will load here automatically -->
      </div>

      <!-- Load More button will be placed here by script.js -->
      <div id="loadMoreSpot"></div>

      <!-- HOME PAGE NATIVE AD -->
      <div class="ad-slot ad-home-bottom">
        <script async="async" data-cfasync="false" src="https://pl29449153.profitablecpmratenetwork.com/e90089e8cc0c6b4c6ff55210388a5238/invoke.js"></script>
        <div id="container-e90089e8cc0c6b4c6ff55210388a5238"></div>
      </div>

      <!-- HOME PAGE SOCIAL BAR AD -->
      <script src="https://pl29118316.profitablecpmratenetwork.com/1d/a5/60/1da560e9f3b77f26473bdf134ff1f1c0.js"></script>
    </section>

  </main>

  <footer>
    <p>© 2026 ALDZONE. All rights reserved.</p>
  </footer>

  <script src="games.js"></script>
  <script src="videos.js"></script>
  <script>
    const gamesGrid = document.getElementById("gamesGrid");
    const games = Array.isArray(window.siteGames) ? window.siteGames : [];

    if (!gamesGrid) {
      console.error("gamesGrid not found.");
    } else if (games.length === 0) {
      gamesGrid.innerHTML = `<p class="empty-message">No games added yet.</p>`;
    } else {
      gamesGrid.innerHTML = games.map((game) => {
        const title = escapeHTML(game.title || "Game");
        const link = escapeAttribute(game.link || "#");
        const thumbnail = escapeAttribute(game.thumbnail || "");

        return `
          <a class="game-card-small" href="${link}" target="_blank" rel="noopener noreferrer">
            <div class="game-card-thumb ${thumbnail ? "" : "thumbnail-failed"}">
              ${
                thumbnail
                  ? `<img src="${thumbnail}" alt="${title}" onerror="this.style.display='none'; this.parentElement.classList.add('thumbnail-failed');">`
                  : ""
              }
            </div>
            <h3>${title}</h3>
          </a>
        `;
      }).join("");
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    function escapeAttribute(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
